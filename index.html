document.getElementById("famBtn").onclick = openSettings;

/* ---------- Sheets ---------- */
function sheet(inner) {
  const root = document.getElementById("sheetRoot");
  root.innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">${inner}</div></div>`;
  document.getElementById("scrim").onclick = e => { if (e.target.id === "scrim") closeSheet(); };
}
function closeSheet() { document.getElementById("sheetRoot").innerHTML = ""; }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

function chipGroup(id, multi, items, selected, noneLabel) {
  return `<div class="chips" id="${id}">${!multi && noneLabel ? `<button type="button" class="chip plain ${!selected.length?"on":""}" data-id="">${noneLabel}</button>` : ""}${items.map(([val, html, plain]) => `<button type="button" class="chip ${plain?"plain":""} ${selected.includes(val)?"on":""}" data-id="${esc(val)}">${html}</button>`).join("")}</div>`;
}
function wireChips(id, multi, onChange) {
  const box = document.getElementById(id);
  box.querySelectorAll(".chip").forEach(c => c.onclick = () => {
    if (multi) c.classList.toggle("on"); else { box.querySelectorAll(".chip").forEach(x => x.classList.remove("on")); c.classList.add("on"); }
    onChange && onChange();
  });
  return () => [...box.querySelectorAll(".chip.on")].map(c => c.dataset.id).filter(Boolean);
}
const memberItems = () => S.members.map(m => [m.id, avatar(m, "sm") + esc(m.name)]);

function openTask(id) {
  const x = id ? S.tasks.find(t => t.id === id) : null;
  const r = x && x.repeat ? x.repeat : null;
  const rtype = r ? r.type : "none";
  const wdSel = r && r.wd ? r.wd.map(String) : [];
  sheet(`<form id="tkForm">
    <h2>${x ? "Aufgabe bearbeiten" : "Neue Aufgabe"}</h2>
    <div class="field"><label class="label" for="tkTitle">Was ist zu tun</label><input type="text" id="tkTitle" placeholder="z. B. Altpapier rausbringen" value="${x ? esc(x.title) : ""}" required></div>
    <div class="field"><label class="label" for="tkDesc">Beschreibung (optional)</label><textarea id="tkDesc" rows="3" placeholder="Details, Links, Telefonnummern …">${x ? esc(x.desc || "") : ""}</textarea>
      ${x && /https?:\/\//.test(x.desc || "") ? `<div class="desclinks">${linkify((x.desc.match(/https?:\/\/[^\s]+/g) || []).join("\n"))}</div>` : ""}</div>
    <div class="field"><span class="label">Bereich</span>${chipGroup("tkCat", false, CATS.map(c => [c, esc(c), true]), x && x.cat ? [taskCat(x.cat)] : [], "Keiner")}</div>
    <div class="field"><span class="label">Wer</span>${chipGroup("tkWho", false, memberItems(), x ? (x.who ? [x.who] : []) : (taskFilter !== "all" ? [taskFilter] : []), "Wer Zeit hat")}</div>
    <div class="two">
      <div class="field"><label class="label" for="tkRep">Wiederholen</label><select id="tkRep">${REPEATS.map(([v, l]) => `<option value="${v}" ${v===rtype?"selected":""}>${l}</option>`).join("")}</select></div>
      <div class="field"><label class="label" for="tkDue" id="tkDueLbl">Fällig am</label><input type="date" id="tkDue" value="${x && x.due ? x.due : ""}"></div>
    </div>
    <div class="field" id="tkWdBox" hidden><span class="label">An welchen Tagen</span>${chipGroup("tkWd", true, DOW.map((d, i) => [String(i), d, true]), wdSel)}</div>
    <div class="field" id="tkNBox" hidden><span class="label">Abstand</span><div class="inline">alle <input type="number" id="tkN" min="1" max="365" value="${r && r.n ? r.n : 3}"> Tage</div></div>
    <label class="checkrow" id="tkRotBox" hidden><input type="checkbox" id="tkRot" ${x && x.rotate ? "checked" : ""}> Abwechselnd: nach jedem Erledigen ist die nächste Person dran</label>
    <p class="hint" id="tkRepHint"></p>
    <div class="row"><button class="btn" type="submit">Speichern</button><button class="btn ghost" type="button" onclick="closeSheet()">Abbrechen</button>
      ${x ? `<span class="grow"></span><button class="btn danger" type="button" id="tkDel">Löschen</button>` : ""}</div></form>`);
  const getCat = wireChips("tkCat", false);
  const getWho = wireChips("tkWho", false);
  const repSel = document.getElementById("tkRep");
  const sync = () => {
    const v = repSel.value;
    document.getElementById("tkWdBox").hidden = !(v === "weekly" || v === "biweekly");
    document.getElementById("tkNBox").hidden = v !== "days";
    document.getElementById("tkDueLbl").textContent = v === "none" ? "Fällig am" : "Erstes Mal am";
    const preview = buildRepeat();
    document.getElementById("tkRotBox").hidden = v === "none" || S.members.length < 2;
    document.getElementById("tkRepHint").textContent = preview ? "Nach dem Abhaken springt die Aufgabe automatisch auf den nächsten Termin: " + repLabel(preview) + "." : "";
  };
  const getWd = wireChips("tkWd", true, sync);
  const buildRepeat = () => {
    const v = repSel.value; if (v === "none") return null;
    const due = document.getElementById("tkDue").value;
    const anchor = (r && r.type === v && r.anchor) ? r.anchor : (due || ymd(today));
    const rep = { type: v, anchor };
    if (v === "weekly" || v === "biweekly") { const wd = getWd().map(Number); rep.wd = wd.length ? wd : [wdIdx(parse(anchor))]; }
    if (v === "days") rep.n = Math.max(1, parseInt(document.getElementById("tkN").value, 10) || 1);
    if (v === "monthly" && due) rep.anchor = due;
    return rep;
  };
  repSel.onchange = sync; document.getElementById("tkDue").onchange = sync; document.getElementById("tkN").oninput = sync;
  sync();
  if (!x) document.getElementById("tkTitle").focus();
  if (x) document.getElementById("tkDel").onclick = () => { const prev = { ...x }; remove("tasks", x.id); log(`hat die Aufgabe „${x.title}“ gelöscht`); closeSheet(); toast("Aufgabe gelöscht", () => save("tasks", prev.id, prev)); };
  document.getElementById("tkForm").onsubmit = e => { e.preventDefault();
    const title = document.getElementById("tkTitle").value.trim(); if (!title) return;
    const repeat = buildRepeat();
    let due = document.getElementById("tkDue").value;
    if (repeat) {
      const from = due ? parse(due) : today;
      if (repeat.type === "weekly" || repeat.type === "biweekly") {
        due = nextOcc({ type: "weekly", wd: repeat.wd, anchor: ymd(addDays(from, -7)) }, from, true);
        if (repeat.type === "biweekly" || parse(repeat.anchor) > parse(due)) repeat.anchor = due;
      } else { due = ymd(from); repeat.anchor = due; }
    }
    const rotate = !!repeat && S.members.length > 1 && document.getElementById("tkRot").checked;
    let who = getWho()[0] || "";
    if (rotate && !who) who = S.members[0].id;
    const data = { ...(x || {}), title, desc: document.getElementById("tkDesc").value.trim(), cat: getCat()[0] || "", who, due, repeat: repeat || null, rotate, done: x ? x.done : false, ts: x ? x.ts || 0 : Date.now() };
    delete data.id;
    if (!x) Object.assign(data, stamp());
    log(x ? `hat die Aufgabe „${title}“ geändert` : `hat die Aufgabe „${title}“ angelegt`);
    if (x && x.lastDone) data.lastDone = x.lastDone;
    save("tasks", x ? x.id : nid(), data);
    if (who && who !== me && (!x || x.who !== who)) pushNow([who], x ? "Aufgabe für dich" : "Neue Aufgabe für dich", `${title}${due ? " · " + niceDate(due) : ""}${me ? " · von " + firstName(me) : ""}`);
    closeSheet();
  };
}


/* ---------- Eigenständige Version: Firebase (Speicher, Login, Benachrichtigungen) ----------
   Aktiv, wenn config.js geladen ist (window.FAMILIENBRETT) und die Firebase-Skripte da sind. In Claude bleibt alles wie gehabt. */
const CFG = window.FAMILIENBRETT && window.firebase ? window.FAMILIENBRETT : null;
const FBMODE = !!CFG;
const REMINDERS = [["", "Keine"], ["0", "Zur Startzeit"], ["15", "15 Minuten vorher"], ["60", "1 Stunde vorher"], ["180", "3 Stunden vorher"], ["1440", "1 Tag vorher"]];
let fbUnsubs = [];

function occStartMs(date, time) { const d = parse(date); const [h, m] = (time || "08:00").split(":").map(Number); d.setHours(h || 0, m || 0, 0, 0); return d.getTime(); }
function kick() {
  if (!FBMODE || !CFG.workerUrl) return;
  clearTimeout(kick.t);
  kick.t = setTimeout(() => { try { fetch(CFG.workerUrl.replace(/\/$/, "") + "/kick", { method: "POST", mode: "no-cors", keepalive: true }); } catch {} }, 1200);
}
function pushNow(toIds, title, body) {
  if (!FBMODE || mode !== "live") return;
  const to = [...new Set(toIds)].filter(id => id && id !== me && member(id));
  if (!to.length) return;
  save("outbox", "n" + nid(), { due: Date.now(), kind: "now", to, title, body, by: me || "", created: Date.now() }, true);
  kick();
}
function othersOf(ids) { const all = S.members.map(m => m.id); return (ids && ids.length ? ids : all).filter(id => id !== me); }
function scheduleReminders(ev) {
  if (!FBMODE || mode !== "live" || ev.remind == null || ev.remind === "") return;
  const now = Date.now(), horizon = now + 36 * 3600e3;
  occurrences(ymd(today), ymd(addDays(today, 3)), [ev]).filter(o => !o.span || o.date === ev.date).forEach(o => {
    const base = ev.birthday || !ev.time ? occStartMs(o.date, "08:00") : occStartMs(o.date, ev.time);
    const fire = base - (+ev.remind) * 60000;
    if (fire > now - 60000 && fire < horizon) save("outbox", `rem_${ev.id}_${o.date}`, { due: fire, kind: "reminder", event: ev.id, occ: o.date, remind: +ev.remind, created: Date.now() }, true);
  });
  kick();
}
function afterEventSave(ev, isNew) {
  scheduleReminders(ev);
  if (isNew) pushNow(othersOf(ev.who), "Neuer Termin", `${ev.title} · ${niceDate(ev.date)}${ev.time ? " " + ev.time : ""}${me ? " · von " + firstName(me) : ""}`);
}

async function fbBoot() {
  firebase.initializeApp(CFG.firebase);
  const fdb = firebase.firestore();
  try { fdb.settings({ ignoreUndefinedProperties: true, merge: true }); } catch {}
  try { await fdb.enablePersistence({ synchronizeTabs: true }); } catch {}
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  render();
  firebase.auth().onAuthStateChanged(user => {
    fbUnsubs.forEach(u => { try { u(); } catch {} }); fbUnsubs = [];
    if (!user) { mode = "loading"; showLogin(); return; }
    hideLogin();
    db = fdb; mode = "live"; COLS.forEach(c => S[c] = []); showBanner(""); render();
    let firstLive = false;
    const slow = setTimeout(() => { if (!firstLive) showBanner("Die Familiendaten sind gerade nicht erreichbar. Sie erscheinen, sobald die Verbindung steht."); }, 10000);
    COLS.forEach(c => fbUnsubs.push(fdb.collection(c).onSnapshot({ includeMetadataChanges: false }, snap => {
      S[c] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if (!firstLive) { firstLive = true; clearTimeout(slow); showBanner(""); }
      if (c === "activity") pruneActivity();
      render();
    }, err => { clearTimeout(slow); showBanner(err && err.code === "permission-denied" ? "Dieses Konto hat keinen Zugriff auf die Familiendaten. Ist die E-Mail-Adresse in den Firestore-Regeln eingetragen?" : "Die Verbindung zu den Familiendaten wurde getrennt. Lade die App neu."); })));
    try {
      if (firebase.messaging && firebase.messaging.isSupported && firebase.messaging.isSupported()) {
        firebase.messaging().onMessage(p => { const n = (p && p.notification) || {}; toast([n.title, n.body].filter(Boolean).join(": ")); });
      }
    } catch {}
  });
}
function showLogin() {
  let el = document.getElementById("login");
  if (!el) {
    el = document.createElement("div"); el.id = "login"; el.className = "login";
    el.innerHTML = `<form id="loginForm" class="loginbox">
      <h1>Familien<span>brett</span></h1>
      <p class="muted" style="margin:0">Melde dich mit deinem Konto an. Danach bleibst du auf diesem Gerät angemeldet.</p>
      <div class="field"><label class="label" for="lgMail">E-Mail</label><input type="email" id="lgMail" autocomplete="username" required></div>
      <div class="field"><label class="label" for="lgPw">Passwort</label><input type="password" id="lgPw" autocomplete="current-password" required></div>
      <p class="loginerr" id="lgErr" hidden></p>
      <button class="btn" type="submit">Anmelden</button>
      <button class="link" type="button" id="lgReset" style="justify-self:start">Passwort vergessen?</button></form>`;
    document.body.appendChild(el);
    const err = t => { const e = document.getElementById("lgErr"); e.textContent = t; e.hidden = !t; };
    document.getElementById("loginForm").onsubmit = async e => {
      e.preventDefault(); err("");
      try { await firebase.auth().signInWithEmailAndPassword(document.getElementById("lgMail").value.trim(), document.getElementById("lgPw").value); }
      catch (x) { err(/wrong-password|invalid-credential|user-not-found|invalid-email/.test(x.code || "") ? "E-Mail oder Passwort stimmt nicht." : x.code === "auth/too-many-requests" ? "Zu viele Versuche. Warte kurz und versuch es dann nochmal." : "Anmelden hat nicht geklappt. Prüf die Verbindung."); }
    };
    document.getElementById("lgReset").onclick = async () => {
      const mail = document.getElementById("lgMail").value.trim();
      if (!mail) { err("Trag zuerst deine E-Mail-Adresse ein."); return; }
      try { await firebase.auth().sendPasswordResetEmail(mail); err(""); toast("Wir haben dir eine E-Mail zum Zurücksetzen geschickt"); } catch { err("Das hat nicht geklappt. Stimmt die E-Mail-Adresse?"); }
    };
  }
  el.hidden = false;
}
function hideLogin() { const el = document.getElementById("login"); if (el) el.hidden = true; }

/* Benachrichtigungen auf diesem Gerät */
function isStandalone() { return (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true; }
function isIOS() { return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); }
function pushState() {
  if (!FBMODE) return "off";
  if (isIOS() && !isStandalone()) return "install";
  if (!("Notification" in window) || !("serviceWorker" in navigator)) return "unsupported";
  if (Notification.permission === "denied") return "denied";
  return lsGet("fb-device", "") && Notification.permission === "granted" ? "on" : "ready";
}
function tokenId(t) { let h = 0; for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) | 0; return "d" + (h >>> 0).toString(36) + t.length; }
async function enablePush() {
  if (!me) { openWhoAmI(); return; }
  try {
    const perm = await Notification.requestPermission();
    if (perm !== "granted") { toast("Benachrichtigungen wurden nicht erlaubt"); openSettings(); return; }
    const reg = await navigator.serviceWorker.register("sw.js");
    await navigator.serviceWorker.ready;
    const token = await firebase.messaging().getToken({ vapidKey: CFG.vapidKey, serviceWorkerRegistration: reg });
    if (!token) throw new Error("kein Token");
    const id = tokenId(token);
    await db.collection("devices").doc(id).set({ token, member: me, ua: navigator.userAgent.slice(0, 140), at: Date.now() });
    lsSet("fb-device", id);
    toast("Benachrichtigungen sind an");
  } catch (e) { toast("Benachrichtigungen ließen sich nicht einschalten. " + (e && e.message ? e.message.slice(0, 80) : "")); }
  openSettings();
}
async function disablePush() {
  const id = lsGet("fb-device", "");
  if (id) { try { await db.collection("devices").doc(id).delete(); } catch {} }
  lsSet("fb-device", ""); toast("Benachrichtigungen auf diesem Gerät sind aus"); openSettings();
}
function syncDeviceMember() { const id = lsGet("fb-device", ""); if (FBMODE && id && me && db) db.collection("devices").doc(id).set({ member: me, at: Date.now() }, { merge: true }).catch(() => {}); }
async function testPush() { pushNowSelf("Test", "So sehen Benachrichtigungen vom Familienbrett aus."); }
function pushNowSelf(title, body) { if (!FBMODE || !me) return; save("outbox", "n" + nid(), { due: Date.now(), kind: "now", to: [me], title, body, created: Date.now() }, true); kick(); toast("Test ist unterwegs, das kann bis zu einer Minute dauern"); }

function settingsExtraHtml() {
  let h = "";
  if (FBMODE) {
    const ps = pushState(), notify = S.settings.find(x => x.id === "notify") || {};
    const pushHtml = {
      on: `<div class="row between"><span class="grow">Sind auf diesem Gerät an.</span><button class="btn small ghost" type="button" onclick="testPush()">Test</button><button class="btn small ghost" type="button" onclick="disablePush()">Ausschalten</button></div>`,
      ready: `<button class="btn" type="button" onclick="enablePush()">Auf diesem Gerät einschalten</button>`,
      install: `<p class="muted" style="margin:0">Auf dem iPhone gehen Benachrichtigungen nur, wenn die App auf dem Home-Bildschirm liegt: in Safari unten auf „Teilen“ tippen, dann „Zum Home-Bildschirm“. Danach die App von dort öffnen und hier einschalten.</p>`,
      denied: `<p class="muted" style="margin:0">Benachrichtigungen sind für diese App blockiert. Erlaube sie in den Einstellungen des Handys und öffne die App neu.</p>`,
      unsupported: `<p class="muted" style="margin:0">Dieser Browser kann keine Benachrichtigungen empfangen.</p>`
    }[ps] || "";
    h += `<div class="field"><span class="label">Benachrichtigungen</span>${pushHtml}</div>`;
    if (S.members.length > 1 && (!notify.sweetFrom || notify.sweetFrom === me)) {
      h += `<div class="field"><span class="label">Jeden Tag eine liebe Nachricht an</span>
        <div class="chips" id="sweetTo"><button type="button" class="chip plain ${!notify.sweetTo ? "on" : ""}" data-id="">Aus</button>${S.members.filter(m => m.id !== me).map(m => `<button type="button" class="chip ${notify.sweetTo === m.id ? "on" : ""}" data-id="${m.id}">${avatar(m, "sm")}${esc(m.name)}</button>`).join("")}</div>
        <p class="hint">Kommt zu einer zufälligen Zeit am Tag, mit deinem Namen als Absender. Nur du siehst diese Einstellung.</p></div>`;
    }
    h += `<div class="field"><span class="label">Daten aus der Claude-Version übernehmen</span><button class="item" type="button" onclick="openImportData()"><span class="title grow" style="text-align:left">Daten einfügen</span><span class="link">Öffnen</span></button></div>`;
    h += `<button class="btn ghost" type="button" onclick="firebase.auth().signOut();closeSheet()">Abmelden</button>`;
  } else {
    h += `<div class="field"><span class="label">Umzug in die eigene App</span><button class="item" type="button" onclick="openExportData()"><span class="title grow" style="text-align:left">Alle Daten kopieren</span><span class="link">Öffnen</span></button></div>`;
  }
  return h;
}
function wireSettingsExtra() {
  const box = document.getElementById("sweetTo");
  if (box) box.querySelectorAll(".chip").forEach(c => c.onclick = () => {
    box.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === c));
    save("settings", "notify", { ...(S.settings.find(x => x.id === "notify") || {}), id: undefined, sweetTo: c.dataset.id, sweetFrom: me || "" });
  });
}

/* Umzug: Daten aus Claude kopieren und in der eigenen App einfügen */
const EXPORT_COLS = ["members", "events", "shopping", "tasks", "recipes", "meals", "products", "settings"];
function openExportData() {
  const data = {}; EXPORT_COLS.forEach(c => data[c] = S[c].filter(x => !(c === "settings" && x.id === "trip")));
  const json = JSON.stringify({ app: "familienbrett", v: 1, at: Date.now(), data });
  const n = EXPORT_COLS.reduce((s, c) => s + data[c].length, 0);
  sheet(`<h2>Alle Daten kopieren</h2>
    <p class="muted" style="margin:0">${n} Einträge: Familie, Termine, Einkauf, Aufgaben, Kochbuch, Essensplan, Marktplan. Kopier den Text und füg ihn in der eigenen App unter Einstellungen → „Daten einfügen“ ein.</p>
    <textarea id="expTxt" rows="6" readonly>${esc(json)}</textarea>
    <div class="row"><button class="btn" type="button" id="expCopy">Kopieren</button><button class="btn ghost" type="button" onclick="openSettings()">Zurück</button></div>`);
  document.getElementById("expCopy").onclick = async () => {
    const t = document.getElementById("expTxt");
    try { await navigator.clipboard.writeText(json); toast("Kopiert"); } catch { t.focus(); t.select(); toast("Text ist markiert. Jetzt mit „Kopieren“ aus dem Menü übernehmen."); }
  };
}
function openImportData() {
  sheet(`<h2>Daten einfügen</h2>
    <p class="muted" style="margin:0">In der Claude-Version unter Einstellungen → „Alle Daten kopieren“ den Text kopieren und hier einfügen. Vorhandene Einträge mit gleicher Kennung werden überschrieben, nichts wird gelöscht.</p>
    <textarea id="impTxt" rows="6" placeholder="Hier einfügen …"></textarea>
    <p class="loginerr" id="impErr" hidden></p>
    <div class="row"><button class="btn" type="button" id="impGo">Übernehmen</button><button class="btn ghost" type="button" onclick="openSettings()">Zurück</button></div>`);
  document.getElementById("impGo").onclick = async () => {
    const err = t => { const e = document.getElementById("impErr"); e.textContent = t; e.hidden = !t; };
    let obj;
    try { obj = JSON.parse(document.getElementById("impTxt").value); } catch { err("Das ist kein gültiger Export. Bitte den ganzen Text kopieren."); return; }
    if (!obj || obj.app !== "familienbrett" || !obj.data) { err("Das sieht nicht nach einem Familienbrett-Export aus."); return; }
    const writes = [];
    EXPORT_COLS.forEach(c => (obj.data[c] || []).forEach(d => { if (d && d.id) { const { id, ...rest } = d; writes.push([c, id, rest]); } }));
    const btn = document.getElementById("impGo"); btn.disabled = true; btn.textContent = "Übernehme …";
    try {
      for (let i = 0; i < writes.length; i += 400) {
        const batch = db.batch();
        writes.slice(i, i + 400).forEach(([c, id, d]) => batch.set(db.collection(c).doc(id), d));
        await batch.commit();
      }
      closeSheet(); toast(`${writes.length} Einträge übernommen`);
    } catch (e) { err("Übernehmen hat nicht geklappt: " + (e && e.code || "unbekannter Fehler")); btn.disabled = false; btn.textContent = "Übernehmen"; }
  };
}

if (FBMODE) fbBoot(); else boot();
